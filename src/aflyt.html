<title>AFLYT Night Ops</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one fixed night street on top, the order desk below. Nothing pans; only the people move. */
:root{
  --night:#0b0f14; --street:#141a22; --desk:#10151c; --raise:#18202a; --line:#27313f;
  --ink:#e8e2d3; --dim:#8e97a4; --sodium:#e3a64a; --alarm:#e25b4e; --ok:#7db8a3; --guard:#d98a7e;
  --f-display:"Big Shoulders Stencil Display","Impact","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
#app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.screen{display:flex;flex-direction:column;flex:1;min-height:0}

/* menu */
#menu{gap:18px;padding-block:22px 18px;overflow:auto}
.logo{font:800 64px/0.9 var(--f-display);letter-spacing:.04em;margin:0;color:var(--ink)}
.logo span{color:var(--sodium)}
.tag{margin:6px 0 0;color:var(--dim);max-width:34ch}
.nights{display:grid;gap:10px}
.ncard{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;
  background:var(--desk);border:1px solid var(--line);border-radius:6px;padding:12px}
.ncard .no{font:800 30px/1 var(--f-display);color:var(--sodium)}
.ncard b{display:block;font-weight:600}
.ncard small{color:var(--dim)}
.ncard[disabled]{opacity:.45;cursor:default}
.rate{font:600 11px/1 var(--f-mono);letter-spacing:.08em;padding:5px 7px;border-radius:3px;border:1px solid currentColor}
.r-SILENT{color:var(--ok)} .r-QUIET{color:var(--ink)} .r-SEEN{color:var(--sodium)} .r-BURNED{color:var(--alarm)} .r-NONE{color:var(--dim)}
.daily{background:var(--desk);border:1px dashed var(--line);border-radius:6px;padding:12px;display:grid;gap:8px}
.daily h3,.sheet h3{margin:0;font:700 22px/1 var(--f-display);letter-spacing:.05em}
.hist{display:flex;gap:6px;flex-wrap:wrap;font:12px var(--f-mono);color:var(--dim)}
.mfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.ghost{border:1px solid var(--line);border-radius:4px;padding:8px 12px;color:var(--dim)}
.how{color:var(--dim);font-size:13px;margin:0}

/* game */
.ghead{display:grid;grid-template-columns:36px 1fr auto 36px;align-items:center;gap:8px;padding-block:8px 6px}
.icon{width:36px;height:36px;border:1px solid var(--line);border-radius:4px;font:600 16px var(--f-mono);color:var(--dim)}
.gtitle{display:flex;flex-direction:column;min-width:0}
.gtitle b{font:700 20px/1 var(--f-display);letter-spacing:.06em}
.gtitle span{font:12px var(--f-mono);color:var(--dim)}
.alarm{display:flex;gap:4px} .alarm i{width:10px;height:10px;border-radius:50%;border:1px solid var(--alarm)} .alarm i.on{background:var(--alarm)}
.boardwrap{position:relative}
#board{display:block;width:100%;aspect-ratio:360/300;max-width:100%;border-radius:6px;background:var(--night);touch-action:manipulation}
.caption{position:absolute;left:8px;right:8px;bottom:8px;font:12px/1.35 var(--f-mono);color:var(--ink);text-shadow:0 1px 3px #000;pointer-events:none}
.toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font:12px var(--f-mono);white-space:nowrap;pointer-events:none}
.tl{position:relative;height:22px;margin-top:4px;font:10px var(--f-mono);color:var(--dim)}
.tl .tk{position:absolute;top:0;width:1px;height:6px;background:var(--line)}
.tl .lb{position:absolute;top:7px;transform:translateX(-50%)}
.tl .cur{position:absolute;top:-2px;width:2px;height:10px;background:var(--sodium);transform:translateX(-1px)}
.brief{font-size:13px;color:var(--dim);padding:6px 0 2px}
.brief b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:6px}
.tab{padding:9px 14px;font:600 13px var(--f-mono);letter-spacing:.06em;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--sodium)}
.panel{flex:1;min-height:0;overflow:auto;padding-block:10px;display:flex;flex-direction:column;gap:10px}
.bug{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--desk);border:1px solid var(--line);border-radius:6px;padding:10px}
.play{width:44px;height:44px;border-radius:50%;border:1px solid var(--sodium);color:var(--sodium);font-size:16px}
.bug.playing .play{background:var(--sodium);color:var(--night)}
.bug b{display:block;font-weight:600;font-size:14px}
.bug small{font:11px var(--f-mono);color:var(--dim)}
.wave{display:flex;gap:2px;height:14px;align-items:flex-end;margin-top:4px}
.wave i{width:3px;background:var(--line);height:4px;border-radius:1px}
.bug.playing .wave i{background:var(--sodium);animation:wv .7s ease-in-out infinite alternate}
.wave i:nth-child(2n){animation-delay:.2s}.wave i:nth-child(3n){animation-delay:.35s}
@keyframes wv{to{height:14px}}
.txtbtn{font:11px var(--f-mono);color:var(--dim);border:1px solid var(--line);border-radius:3px;padding:4px 6px}
.trans{grid-column:1/-1;font:13px/1.5 var(--f-mono);color:var(--ink);border-top:1px dashed var(--line);padding-top:8px}
.trans p{margin:0}.trans em{font-style:normal;color:var(--dim)}
.note{font-size:12px;color:var(--dim)}
.slip{display:grid;gap:8px}
.oline{display:grid;grid-template-columns:22px 1fr 32px;gap:6px;align-items:center}
.oline .n{font:12px var(--f-mono);color:var(--dim);text-align:right}
.oline textarea{width:100%;box-sizing:border-box;background:var(--street);border:1px solid var(--line);border-radius:4px;color:var(--ink);font:16px/1.35 var(--f-mono);padding:9px 8px;resize:none;overflow:hidden;display:block}
.oline textarea:focus{border-color:var(--sodium);outline:none}
.oline .del{height:36px;color:var(--dim);font:16px var(--f-mono)}
.draftlbl{font:11px var(--f-mono);color:var(--sodium);margin-left:28px}
.tiles{display:flex;flex-wrap:wrap;gap:5px;margin-left:28px;min-height:8px}
.tile{font:13px var(--f-mono);background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:5px 7px;touch-action:none;user-select:none;-webkit-user-select:none}
.tile.drag{border-color:var(--sodium);color:var(--sodium)}
.keys{display:flex;gap:6px;margin-left:28px;flex-wrap:wrap}
.keys button{min-width:36px;height:32px;border:1px solid var(--line);border-radius:4px;font:14px var(--f-mono)}
.addo{justify-self:start;margin-left:28px;font:12px var(--f-mono);color:var(--dim);border:1px dashed var(--line);border-radius:4px;padding:7px 10px}
.runbar{padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.run{flex:1;height:48px;border-radius:6px;background:var(--sodium);color:var(--night);font:800 22px/1 var(--f-display);letter-spacing:.12em}
.run[disabled]{opacity:.4}
.run.alt{background:none;border:1px solid var(--line);color:var(--ink);flex:0 0 auto;padding:0 16px;font-size:16px}
.log{font:12px/1.5 var(--f-mono);display:grid;gap:3px}
.log .t{color:var(--dim)} .log .bad{color:var(--alarm)} .log .good{color:var(--ok)} .log .sys{color:var(--sodium)}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(5,7,10,.72);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.sheet-in{width:100%;max-width:460px;max-height:88%;overflow:auto;background:var(--desk);border-top:1px solid var(--line);border-radius:10px 10px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:grid;gap:14px}
.stamp{justify-self:start;font:800 46px/1 var(--f-display);letter-spacing:.08em;border:3px solid currentColor;padding:4px 12px 2px;transform:rotate(-3deg);animation:st .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes st{from{transform:rotate(-3deg) scale(1.6);opacity:0}}
.score{font:14px var(--f-mono);color:var(--dim)} .score b{color:var(--ink);font-size:18px}
.chip{font:11px var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:var(--sodium)}
.what{margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px}
.err{border:1px solid var(--line);border-radius:6px;padding:10px;display:grid;gap:6px;background:var(--night)}
.err header{display:flex;gap:8px;align-items:baseline}
.rid{font:600 12px var(--f-mono);color:var(--night);background:var(--sodium);border-radius:3px;padding:1px 5px}
.err p{margin:0;font-size:14px}
.fix{display:flex;gap:8px;align-items:center;font:14px var(--f-mono);color:var(--ok)}
.say{width:30px;height:30px;border-radius:50%;border:1px solid var(--ok);color:var(--ok);flex:0 0 auto;font-size:12px}
.form{overflow-x:auto}
.form table{border-collapse:collapse;font:12px var(--f-mono);min-width:100%}
.form th{color:var(--dim);font-weight:400;text-align:left;padding:2px 6px;border-bottom:1px solid var(--line)}
.form td{padding:4px 6px;color:var(--ink);white-space:nowrap}
.form td.v{color:var(--sodium)}
.tip{font-size:13px;color:var(--dim)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1 1 auto;min-height:44px;border-radius:6px;border:1px solid var(--line);padding:0 14px;font:600 14px var(--f-mono)}
.btn.primary{background:var(--sodium);border-color:var(--sodium);color:var(--night)}
details summary{cursor:pointer;color:var(--dim);font:12px var(--f-mono)}
.voice-row{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.voice-row.on{border-color:var(--sodium)}
.coach{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(428px,calc(100% - 32px));
  background:var(--sodium);color:var(--night);border-radius:6px;padding:10px 12px;font-size:14px;font-weight:500;z-index:15;box-sizing:border-box;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.coach button{text-decoration:underline;margin-left:6px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<div id="app">
  <section id="menu" class="screen">
    <div>
      <h1 class="logo">AFLY<span>T</span></h1>
      <p class="tag">Night operations in Danish. Listen to the bugs, write the orders, and watch your operatives do exactly what you wrote.</p>
    </div>
    <div id="nights" class="nights"></div>
    <div id="daily" class="daily"></div>
    <p class="how">Headphones on. Every night is different: the minutes, the words and the traps change each time you play.</p>
    <div class="mfoot">
      <button id="m-voice" class="ghost" type="button">Voice</button>
      <button id="m-sound" class="ghost" type="button">Sound on</button>
      <button id="m-form" class="ghost" type="button">Order form</button>
    </div>
  </section>

  <section id="game" class="screen" hidden>
    <header class="ghead">
      <button id="g-back" class="icon" type="button" aria-label="Back to the menu">‹</button>
      <div class="gtitle"><b id="g-name">NIGHT 1</b><span id="g-sub">Lygtegade · 22:00</span></div>
      <div id="alarm" class="alarm" aria-label="Alarm"><i></i><i></i><i></i></div>
      <button id="g-form" class="icon" type="button" aria-label="Open the order form">F</button>
    </header>
    <div class="boardwrap">
      <canvas id="board" aria-label="The street"></canvas>
      <div id="caption" class="caption"></div>
      <div id="toast" class="toast" hidden></div>
    </div>
    <div id="tl" class="tl"></div>
    <div id="brief" class="brief"></div>
    <nav class="tabs" id="tabs">
      <button id="tab-listen" class="tab on" type="button">LISTEN</button>
      <button id="tab-orders" class="tab" type="button">ORDERS</button>
    </nav>
    <div id="p-listen" class="panel"></div>
    <div id="p-orders" class="panel" hidden></div>
    <div id="p-run" class="panel" hidden><div id="runlog" class="log"></div></div>
    <div class="runbar">
      <button id="b-run" class="run" type="button">RUN</button>
      <button id="b-skip" class="run alt" type="button" hidden>Skip ▸▸</button>
    </div>
  </section>

  <div id="sheet" class="sheet" hidden><div id="sheet-in" class="sheet-in"></div></div>
  <div id="coach" class="coach" hidden></div>
</div>

<script>
'use strict';
/* ---------- small helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={
  get(k,d){try{const v=localStorage.getItem('aflyt1:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('aflyt1:'+k,JSON.stringify(v))}catch(e){}}
};
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NUMW=['nul','et','to','tre','fire','fem','seks','syv','otte','ni','ti'];
const minW=n=>n===1?'et minut':NUMW[n]+' minutter';
function clock(m){const tot=22*60+m;return Math.floor(tot/60)+':'+String(((tot%60)+60)%60).padStart(2,'0')}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- lexicon ---------- */
const NOUNS={
  bager:{g:'en',def:'bageren',bad:['bageret'],en:'bakery',show:'bager'},
  posthus:{g:'et',def:'posthuset',bad:['posthusen','posthuse'],en:'post office',show:'posthus'},
  cafe:{g:'en',def:'cafeen',bad:['cafeet','cafen'],en:'café',show:'café'},
  kiosk:{g:'en',def:'kiosken',bad:['kiosket'],en:'kiosk',show:'kiosk'},
  apotek:{g:'et',def:'apoteket',bad:['apoteken'],en:'pharmacy',show:'apotek'},
  bil:{g:'en',def:'bilen',bad:['bilet'],en:'car (your van)',show:'bil'},
  nøgle:{g:'en',def:'nøglen',bad:['nøglet'],en:'key',show:'nøgle'},
  vagt:{g:'en',def:'vagten',bad:['vagtet'],en:'guard',show:'vagt'},
  telefon:{g:'en',def:'telefonen',bad:['telefonet'],en:'phone',show:'telefon'}
};
const FORM={};
for(const [s,n] of Object.entries(NOUNS)){FORM[s]={stem:s,form:'bare'};FORM[n.def]={stem:s,form:'def'};n.bad.forEach(b=>FORM[b]={stem:s,form:'bad'})}
const STREETS={lygtegade:{name:'Lygtegade',prep:'i',type:'gade'},molevej:{name:'Molevej',prep:'på',type:'vej'}};
const VERBS={går:['gå','pres'],gik:['gå','past'],gå:['gå','inf'],tager:['tage','pres'],tog:['tage','past'],tage:['tage','inf'],
  henter:['hente','pres'],hentede:['hente','past'],hente:['hente','inf'],venter:['vente','pres'],ventede:['vente','past'],vente:['vente','inf'],
  ringer:['ringe','pres'],ringede:['ringe','past'],ringe:['ringe','inf']};
const PRES={gå:'går',tage:'tager',hente:'henter',vente:'venter',ringe:'ringer'};
const NUMS={et:1,en:1,to:2,tre:3,fire:4,fem:5,seks:6,syv:7,otte:8,ni:9,ti:10};
const RULES={
  R2:{n:'for at + infinitive',tip:'After for at, the verb stays in the infinitive: for at hente, not for at henter.'},
  R5:{n:'The verb comes second',tip:'If a time, a når-clause or Derefter stands first, the verb comes next and the person after it: Om to minutter går Ida …'},
  R6:{n:'Orders use the present',tip:'An order happens now or later, so it uses the present: går, henter. Past forms (gik, hentede) only report what already happened.'},
  R7:{n:'om · i · for … siden',tip:'om tre minutter = three minutes from now. i tre minutter = for three minutes. for tre minutter siden = three minutes ago.'},
  R8:{n:'når or da',tip:'når = every time it happens, so it works as a trigger. da = one time, already over.'},
  R11:{n:'i or på with a street',tip:'i with -gade and -stræde: i Lygtegade. på with -vej, -allé and -plads: på Molevej.'},
  R12:{n:'en/et and the definite form',tip:'nøglen = the key we know about. en nøgle = any key. en-words take -en (kiosken), et-words take -et (posthuset).'}
};
const PRETTY={cafeen:'caféen',cafe:'café',ida:'Ida',bo:'Bo',lygtegade:'Lygtegade',molevej:'Molevej'};
const pretty=w=>PRETTY[w]||w;
function sentence(toks){let s=toks.map(pretty).join(' ').replace(/ ,/g,',');return cap(s)+'.'}

function tokenize(s){
  s=s.normalize('NFC').toLowerCase().replace(/é/g,'e');
  s=s.replace(/(\d{1,2})[.:](\d{2})/g,'$1#$2');
  s=s.replace(/\bklokken\b/g,' kl ').replace(/\bkl\b\.?/g,' kl ');
  s=s.replace(/,/g,' , ').replace(/[.!?;"“”()]/g,' ');
  return s.split(/\s+/).filter(Boolean).map(w=>w.replace('#',':'));
}

/* ---------- parser: text → order (with known errors executed literally) ---------- */
function parseOrder(text,N,ctx){
  const T=tokenize(text);let i=0;
  const peek=(k=0)=>T[i+k],next=()=>T[i++];
  const o={text:text.trim(),toks:T,trig:{type:'now'},acts:[],errs:[],notes:[],nop:null,op:null,unknown:false,edits:[]};
  const err=(rule,code,msg)=>{if(!o.errs.some(e=>e.code===code))o.errs.push({rule,code,msg})};
  const fail=()=>{o.unknown=true;o.acts=[];return o};
  if(!T.length)return fail();

  function parseNum(){const s=i;const w=next();let n=null;
    if(/^\d+$/.test(w||''))n=+w;else if(w in NUMS)n=NUMS[w];
    if(n==null||n<1||n>10){i=s;return null}
    const u=next();if(u!=='minut'&&u!=='minutter'){i=s;return null}
    return{n,w,u,wi:s}}
  function parseTime(){const s=i;
    if(peek()==='om'){i++;const n=parseNum();if(n)return{k:'om',...n,at:s};i=s;return null}
    if(peek()==='kl'){i++;const m=/^(\d{1,2}):(\d{2})$/.exec(next()||'');if(m)return{k:'kl',h:+m[1],m:+m[2],at:s};i=s;return null}
    if(peek()==='for'&&peek(1)!=='at'){i++;const n=parseNum();if(n&&peek()==='siden'){i++;return{k:'siden',...n,at:s}}i=s;return null}
    if(peek()==='i'){i++;const n=parseNum();if(n)return{k:'i',...n,at:s};i=s;return null}
    return null}
  function addr(np){if((peek()==='i'||peek()==='på')&&STREETS[peek(1)]){np.addr={prep:peek(),pi:i,street:T[i+1]};i+=2}}
  function parseNP(){const w=peek();if(!w)return null;
    if(STREETS[w]){i++;return{street:w,wi:i-1}}
    if(w==='en'||w==='et'){const f=FORM[peek(1)];if(f&&f.form==='bare'){const np={stem:f.stem,form:'indef',art:w,wi:i};i+=2;addr(np);return np}return null}
    const f=FORM[w];if(!f)return null;const np={stem:f.stem,form:f.form,w,wi:i};i++;addr(np);return np}
  function parseSubj(){const w=peek();const op=N.ops.find(x=>x.key===w);
    if(op){i++;ctx[op.pro]=op;return op}
    if(w==='hun'||w==='han'){const op2=ctx[w]||N.ops.find(x=>x.pro===w);if(op2){i++;return op2}}
    return null}
  function parseSub(){const s=i;const k=next();const sw=next();let who;
    if(sw==='vagten')who='guard';else if(sw==='telefonen')who='phone';else{i=s;return null}
    const vi=i;const vw=next();const vv=VERBS[vw];if(!vv){i=s;return null}
    if(who==='guard'&&vv[0]!=='gå'||who==='phone'&&vv[0]!=='ringe'){i=s;return null}
    if(peek()==='til'){i++;if(!parseNP()){i=s;return null}}
    return{k,who,tense:vv[1],vw,vi,ki:s,lemma:vv[0]}}

  let front=null,sub=null,time=null,subEnd=null,frontEnd=0;

  for(const [who,line] of G.N.bugs[k].lines){if(playing!==k)break;SFX.blip();await speak(line,who==='a'?{pitch:.82,rate:.98}:{pitch:1.12,rate:1.02,alt:true});await new Promise(r=>setTimeout(r,180))}
  if(playing===k){bedOff();SFX.crackle();playing=-1;el.classList.remove('playing');G.played[k]=true;const sm=el.querySelector('small');if(sm&&!/heard/.test(sm.textContent))sm.textContent+=' · heard';
    if(G.tut){if(k===0&&!G.played[1])coach('Now Bug 2.');else if(G.played[0]&&G.played[1])coach('Open ORDERS.')}}}

function renderOrders(){const N=G.N;
  $('#p-orders').innerHTML=`<div class="slip">${G.lines.map((l,k)=>`
    ${l.draft?`<div class="draftlbl">Predecessor's draft. Run it, fix it or delete it.</div>`:''}
    <div class="oline" id="row-${k}"><span class="n">${k+1}</span><textarea id="ord-${k}" data-k="${k}" rows="1" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" enterkeyhint="done" placeholder="${k===0?G.N.ops[0].name+' går til …':'Derefter …'}">${esc(l.text)}</textarea><button class="del" type="button" data-d="${k}" aria-label="Delete order ${k+1}">×</button></div>`).join('')}
    <div id="aid"><div class="tiles" id="tiles"></div><div class="keys"><button type="button" data-c="æ">æ</button><button type="button" data-c="ø">ø</button><button type="button" data-c="å">å</button><button type="button" data-c="é">é</button></div></div>
    ${G.lines.length<6?`<button class="addo" type="button" id="addo">+ Add order</button>`:''}</div>
    <p class="note">The radio understands orders like: ${G.N.ops[0].name} går til … · ${G.N.ops[0].name} henter … · Derefter … · Om … minutter … · ${G.N.ops[0].name} venter i … minutter.</p>`;
  document.querySelectorAll('.oline textarea').forEach(inp=>{grow(inp);
    inp.oninput=()=>{inp.value=inp.value.replace(/\n/g,' ');grow(inp);G.lines[+inp.dataset.k].text=inp.value;G.lines[+inp.dataset.k].draft=false;if(+inp.dataset.k===G.active)renderTiles()};
    inp.onfocus=()=>{if(G.active!==+inp.dataset.k){G.active=+inp.dataset.k;placeAid()}};
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();inp.blur()}};
  });
  document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{G.lines.splice(+b.dataset.d,1);if(!G.lines.length)G.lines.push({text:''});G.active=Math.min(G.active,G.lines.length-1);renderOrders()});
  document.querySelectorAll('.keys button').forEach(b=>{b.onpointerdown=e=>e.preventDefault();b.onclick=()=>insertText(b.dataset.c,false)});
  const ad=$('#addo');if(ad)ad.onclick=()=>{G.lines.push({text:''});G.active=G.lines.length-1;renderOrders();$('#ord-'+G.active).focus()};
  placeAid();
}
function grow(t){t.style.height='auto';if(!t.scrollHeight){t.style.height='';return}t.style.height=t.scrollHeight+2+'px'}
function placeAid(){const row=$('#row-'+G.active),aid=$('#aid');if(row&&aid)row.after(aid);renderTiles()}
function insertText(w,asWord){const inp=$('#ord-'+G.active);if(!inp)return;let v=inp.value;let s=inp.selectionStart??v.length,e=inp.selectionEnd??v.length;
  if(document.activeElement!==inp){s=e=v.length}
  let ins=w;if(asWord){if(s>0&&!/\s$/.test(v.slice(0,s)))ins=' '+ins}
  v=v.slice(0,s)+ins+v.slice(e);inp.value=v;grow(inp);G.lines[G.active].text=v;G.lines[G.active].draft=false;const p=s+ins.length;inp.focus();try{inp.setSelectionRange(p,p)}catch(x){}renderTiles()}
function renderTiles(){const box=$('#tiles');if(!box)return;const toks=(G.lines[G.active].text||'').trim().split(/\s+/).filter(Boolean);
  box.innerHTML=toks.length>1?toks.map(t=>`<span class="tile">${esc(t)}</span>`).join(''):'';
  box.querySelectorAll('.tile').forEach(t=>t.onpointerdown=startDrag)}
let drag=null;
function startDrag(e){e.preventDefault();drag=e.currentTarget;drag.classList.add('drag');document.addEventListener('pointermove',onDrag);document.addEventListener('pointerup',endDrag,{once:true})}
function onDrag(e){if(!drag)return;const el=document.elementFromPoint(e.clientX,e.clientY);const t=el&&el.closest&&el.closest('.tile');if(!t||t===drag||t.parentNode!==drag.parentNode)return;
  const kids=[...drag.parentNode.children];if(kids.indexOf(drag)<kids.indexOf(t))t.after(drag);else t.before(drag)}
function endDrag(){document.removeEventListener('pointermove',onDrag);if(!drag)return;drag.classList.remove('drag');
  const words=[...drag.parentNode.children].map(c=>c.textContent);drag=null;const v=words.join(' ');G.lines[G.active].text=v;G.lines[G.active].draft=false;const inp=$('#ord-'+G.active);if(inp){inp.value=v;grow(inp)}}

let toastT=0;
function toast(s){const t=$('#toast');t.textContent=s;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,1800)}
cv.addEventListener('click',e=>{if(G.mode!=='plan')return;const r=cv.getBoundingClientRect();const x=(e.clientX-r.left)*BW/r.width,y=(e.clientY-r.top)*BH/r.height;
  const h=hitTest(G.N,x,y);if(!h)return;ac();toast(h.w+' · '+h.g);speak(h.w,{});tab('orders');
  if(document.activeElement&&document.activeElement.id&&document.activeElement.id.startsWith('ord-')){}
  insertText(h.w,true)});

function coach(s,btn){const c=$('#coach');if(!s){c.hidden=true;return}c.innerHTML=esc(s)+` <button type="button" id="coach-x">${btn||'OK'}</button>`;c.hidden=false;$('#coach-x').onclick=()=>c.hidden=true}

/* ---------- run ---------- */
const MS=1150;let R=null;
function startRun(){
  hush();bedOff();coach(null);if(playing>=0){playing=-1}
  const N=G.N;if(N.reroll&&G.runs>0){const nN=makeNight(G.id,Math.floor(Math.random()*1e6),{});nN.draft=N.draft;G.N=nN;G.seed=nN.seed}
  const ctx={};const lines=G.lines.filter(l=>l.text.trim());if(!lines.length)return;
  const orders=lines.map(l=>parseOrder(l.text,G.N,ctx));
  const sim=simulate(G.N,orders);G.runs++;
  R={orders,sim,tau:0,last:-1,speakUntil:0,pending:[],speed:1,flash:0,seenAt:null,ring:0,done:false,t0:performance.now()};
  G.mode='run';$('#tabs').hidden=true;$('#p-listen').hidden=true;$('#p-orders').hidden=true;$('#p-run').hidden=false;$('#runlog').innerHTML='';
  $('#b-run').hidden=true;$('#b-skip').hidden=false;$('#b-skip').onclick=()=>{R.speed=8;hush()};
  orders.forEach((o,k)=>{if(o.unknown){logLine('22:00',`Line ${k+1}: radio says "Hvad?" Not understood, so it was skipped.`,'sys');SFX.hvad()}});
  SFX.stamp();let lastTs=performance.now();
  const step=ts=>{if(!R||R.done)return;const dt=Math.min(80,ts-lastTs);lastTs=ts;
    if(ts>=R.speakUntil&&!R.speaking){R.tau+=dt/MS*R.speed}
    const t=Math.floor(R.tau);
    while(R.last<t&&R.last<R.sim.end.t){R.last++;onTick(R.last)}
    const endT=R.sim.end.t;const fr=R.sim.frames[Math.min(t,endT)];const u=t>=endT?0:R.tau-t;
    R.flash=Math.max(0,R.flash-dt/600);
    draw(G.N,{frame:fr,u,flash:R.flash,seenAt:R.flash>0?R.seenAt:null,ring:R.ring>ts});
    renderTL(Math.min(R.tau,endT));$('#g-sub').textContent=G.N.name+' · '+clock(Math.min(t,endT));
    if(R.tau>=endT+.9&&!R.speaking){R.done=true;setTimeout(debrief,250);return}
    requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function logLine(t,s,cls){const d=document.createElement('div');d.innerHTML=`<span class="t">${t}</span> <span class="${cls||''}">${s}</span>`;$('#runlog').appendChild(d);d.scrollIntoView({block:'nearest'})}
function placeName(pid){const p=G.N.places[pid];if(!p)return pid;if(p.node)return STREETS[p.node].name;if(p.van)return'bilen';return pretty(NOUNS[p.stem].def)}
function onTick(t){const N=G.N,sim=R.sim;const evs=sim.log.filter(e=>e.t===t);const fr=sim.frames[t];
  SFX.tick();const toSay=[];
  for(const e of evs){
    if(e.k==='phone'){SFX.ring();R.ring=performance.now()+1600;logLine(clock(t),'The phone rings in caféen.','sys')}
    if(e.k==='guard'){logLine(clock(t),e.to==='post'?'The guard walks back to his post.':`The guard walks to ${placeName(e.to)}.`,'sys')}
    if(e.k==='fire'){const o=R.orders[e.idx];const nm=N.ops.find(x=>x.id===o.op).name;
      if(o.ok){toSay.push(o);logLine(clock(t),`${nm}: ${esc(sentenceOf(o))}`,'good')}
      else logLine(clock(t),`${nm}: ${esc(o.text)}`,'bad')}
    if(e.k==='take'){SFX.take();logLine(clock(t),`${N.ops.find(x=>x.id===e.op).name} takes a key.`)}
    if(e.k==='nokey'){logLine(clock(t),`${N.ops.find(x=>x.id===e.op).name} finds no key at ${placeName(e.at)}.`,'bad')}
    if(e.k==='seen'){SFX.seen();R.flash=1;R.seenAt=N.places[e.at].spot;setAlarm(fr.alarm);logLine(clock(t),`SEEN at ${placeName(e.at)}.`,'bad');if(navigator.vibrate)try{navigator.vibrate(120)}catch(x){}}
  }
  if(t===0)R.orders.forEach((o,k)=>{if(o.nop&&!o.unknown){logLine(clock(0),`Line ${k+1}: ${esc(o.text)} (nothing happens)`,'bad')}});
  if(toSay.length&&R.speed===1){R.speaking=true;(async()=>{for(const o of toSay)await speak(sentenceOf(o),{rate:1.02});R.speaking=false})()}
}
function sentenceOf(o){return sentence(o.toks)}

/* ---------- debrief ---------- */
function rating(sim,orders){if(!sim.end.win)return'BURNED';if(sim.alarm>0)return'SEEN';const n=orders.filter(o=>!o.unknown).length;return n<=G.N.par?'SILENT':'QUIET'}
function debrief(){
  const N=G.N,{sim,orders}=R;G.mode='debrief';
  const r=rating(sim,orders);const nOrders=orders.filter(o=>!o.unknown).length;
  let score=0;if(sim.end.win){score=1000-250*sim.alarm-100*Math.max(0,nOrders-N.par)+(10-sim.end.t)*20;if(G.blind)score*=2}
  score=Math.max(0,Math.round(score));
  if(sim.end.win)SFX.chord();else SFX.fail();
  // records
  const best=store.get('best',{});const prev=best[G.id];const better=!prev||ORDER.indexOf(r)>ORDER.indexOf(prev.r)||(r===prev.r&&score>prev.s);
  if(better&&r!=='BURNED')best[G.id]={r,s:score};store.set('best',best);
  if(sim.end.win){store.set('unl',Math.max(store.get('unl',1),Math.min(3,G.id+1)));if(G.tut)store.set('tutDone',true)}
  if(G.daily&&G.daily.counted){const d=store.get('daily',{});d[G.daily.k]={r,s:score};store.set('daily',d);G.daily.counted=false}
  const eh=store.get('errs',{});orders.forEach(o=>o.errs.forEach(e=>eh[e.rule]=(eh[e.rule]||0)+1));store.set('errs',eh);
  const seenR=store.get('rules',[]);orders.forEach(o=>o.errs.forEach(e=>{if(!seenR.includes(e.rule))seenR.push(e.rule)}));store.set('rules',seenR);
  // what happened
  const what=[];
  for(const e of sim.log){if(e.k==='seen')what.push(`${clock(e.t)} · The guard saw ${N.ops.find(x=>x.id===e.op).name} at ${placeName(e.at)}.`);
    if(e.k==='nokey')what.push(`${clock(e.t)} · ${N.ops.find(x=>x.id===e.op).name} reached ${placeName(e.at)}, but the key wasn't there.`)}
  if(!sim.end.win){if(sim.end.why==='wrongkey')what.push('A key reached the van, but the wrong one. "en nøgle" means any key, so the nearest one was taken.');
    else if(sim.end.why==='lockdown')what.push('Three sightings. Lockdown.');else what.push('22:10 · Time ran out. Nøglen never reached the van.')}
  else what.push(`${clock(sim.end.t)} · Nøglen is in the van.`);
  orders.forEach((o,k)=>{if(o.unknown)what.push(`Line ${k+1} wasn't understood, so it was skipped. It isn't marked wrong.`);o.notes.forEach(n=>what.push(n))});
  // errors (max 3 cards)
  const cards=[];
  orders.forEach(o=>{if(!o.errs.length)return;const fix=corrected(o);o.errs.forEach(e=>{if(cards.length<3&&!cards.some(c=>c.e.code===e.code))cards.push({e,fix,o})})});
  const formOf=s=>{if(!s)return'';const o=parseOrder(s,N,{});if(!o.ok)return'';const S=o.slots;
    return `<div class="form"><table><tr><th>F</th><th>v</th><th>n</th><th>a</th><th>V</th><th>N</th><th>A</th></tr><tr><td>${esc(S.F)}</td><td class="v">${esc(S.v)}</td><td>${esc(S.n)}</td><td></td><td></td><td>${esc(S.N)}</td><td>${esc(S.A)}</td></tr></table></div>`};
  const html=`<div class="stamp r-${r}">${r}</div>
    <div class="score"><b>${score.toLocaleString('en')}</b> points${best[G.id]?` · best ${best[G.id].r} ${best[G.id].s.toLocaleString('en')}`:''} ${G.blind&&sim.end.win?'<span class="chip">Blind ×2</span>':''} ${G.daily?'<span class="chip">Tonight\'s seed</span>':''}</div>
    <ol class="what">${what.slice(0,6).map(w=>`<li>${esc(w)}</li>`).join('')}</ol>
    ${cards.map(c=>`<div class="err"><header><span class="rid">${c.e.rule}</span><b>${esc(RULES[c.e.rule].n)}</b></header><p>${esc(c.e.msg)}</p>
      ${c.fix?`<div class="fix"><button class="say" type="button" data-say="${esc(c.fix)}" aria-label="Hear the corrected order">▶</button><span>${esc(c.fix)}</span></div>${formOf(c.fix)}`:''}
      <p class="tip">${esc(RULES[c.e.rule].tip)}</p></div>`).join('')}
    ${sim.end.win&&!cards.length&&r==='QUIET'?`<p class="tip">Clean, but over par. ${N.par} orders can do it.</p>`:''}
    <details><summary>What the bugs said</summary>${N.bugs.map(b=>`<p class="tip"><b>${esc(b.title)}</b> (${b.time})<br>${b.lines.map(l=>esc(l[1])).join('<br>')}</p>`).join('')}</details>
    <div class="btns"><button class="btn ${sim.end.win?'':'primary'}" id="d-rew" type="button">Rewind</button>
      <button class="btn" id="d-new" type="button">New numbers</button>
      ${sim.end.win&&G.id<3?`<button class="btn primary" id="d-next" type="button">Night ${G.id+1}</button>`:''}
      <button class="btn" id="d-menu" type="button">Menu</button></div>`;
  openSheet(html);
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say,{}));
  $('#d-rew').onclick=()=>{closeSheet();rewind()};
  $('#d-new').onclick=()=>{closeSheet();startNight(G.id,{keepLines:true})};
  const nx=$('#d-next');if(nx)nx.onclick=()=>{closeSheet();startNight(G.id+1)};
  $('#d-menu').onclick=()=>{closeSheet();toMenu()};
  if(G.tut&&!sim.end.win)coach('Rewind, fix the order, and make Ida bring the key back to the van (bilen).');
}
function rewind(){const keep=G.lines.slice();startNight(G.id,{keepSeed:true,keepLines:true,seed:G.seed});G.lines=keep;renderOrders();tab('orders')}
function openSheet(h){$('#sheet-in').innerHTML=h;$('#sheet').hidden=false;$('#sheet-in').scrollTop=0}
function closeSheet(){$('#sheet').hidden=true}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'&&G.mode!=='debrief')closeSheet()});
function toMenu(){hush();bedOff();R=null;G.mode='menu';coach(null);show('menu');renderMenu()}
$('#g-back').onclick=toMenu;
$('#b-run').onclick=()=>{ac();startRun()};

/* ---------- order form, voice ---------- */
function openForm(){const seenR=store.get('rules',[]);
  openSheet(`<h3>THE ORDER FORM</h3>
  <p class="tip">Every Danish main clause fills the same slots. Whatever stands in F, the finite verb is always in v.</p>
  <div class="form"><table><tr><th>F</th><th>v</th><th>n</th><th>a</th><th>V</th><th>N</th><th>A</th></tr>
  <tr><td>Ida</td><td class="v">går</td><td></td><td></td><td></td><td></td><td>til posthuset om to minutter</td></tr>
  <tr><td>Om to minutter</td><td class="v">går</td><td>Ida</td><td></td><td></td><td></td><td>til posthuset</td></tr>
  <tr><td>Derefter</td><td class="v">går</td><td>hun</td><td></td><td></td><td></td><td>tilbage til bilen</td></tr></table></div>
  <p class="tip">F front · v finite verb · n subject · a adverb (ikke, også) · V other verbs · N object · A place, time, the rest.</p>
  <p class="tip">Signs on the street: <b>○</b> round plate = en-word (kiosken, bageren). <b>□</b> square plate = et-word (posthuset, apoteket).</p>
  ${seenR.length?'<h3>RULES YOU HAVE MET</h3>'+seenR.map(k=>`<p class="tip"><span class="rid">${k}</span> <b>${esc(RULES[k].n)}</b><br>${esc(RULES[k].tip)}</p>`).join(''):''}
  <div class="btns"><button class="btn" type="button" id="f-x">Close</button></div>`);$('#f-x').onclick=closeSheet}
$('#g-form').onclick=openForm;$('#m-form').onclick=openForm;
function openVoice(){loadVoices();const cur=(voiceFor()||{}).name;
  openSheet(`<h3>VOICE</h3>${VOICES.length?`<p class="tip">Pick the Danish voice that sounds least robotic. Enhanced or premium voices are much better.</p>
    ${VOICES.map(v=>`<div class="voice-row ${v.name===cur?'on':''}"><span>${esc(v.name)}</span><span class="btns"><button class="btn" type="button" data-test="${esc(v.name)}">Test</button><button class="btn ${v.name===cur?'primary':''}" type="button" data-use="${esc(v.name)}">Use</button></span></div>`).join('')}`:
    `<p class="tip">No Danish voice is installed, so the game shows transcripts instead.</p>`}
    <p class="tip">iPhone: Settings › Accessibility › Spoken Content › Voices › Danish, then download an Enhanced voice. Android: Settings › Text-to-speech › install Danish. Then reload this page.</p>
    <div class="btns"><button class="btn" type="button" id="v-x">Close</button></div>`);
  document.querySelectorAll('[data-test]').forEach(b=>b.onclick=()=>{store.set('voice',b.dataset.test);hush();speak('Om tre minutter går Ida til posthuset.',{})});
  document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{store.set('voice',b.dataset.use);openVoice()});
  $('#v-x').onclick=closeSheet}
$('#m-voice').onclick=()=>{ac();openVoice()};
$('#m-sound').onclick=()=>{muted=!muted;store.set('mute',muted);if(master)master.gain.value=muted?0:.7;renderMenu()};
window.addEventListener('resize',()=>{if(G.N){fit();if(G.mode==='plan')draw(G.N)}});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(G.N&&G.mode==='plan')draw(G.N)});
renderMenu();
window.AFLYT={parseOrder,simulate,makeNight,corrected,tokenize,G,rating};
</script>

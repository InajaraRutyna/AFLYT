<style>
/* Layout: picture on top, the scene's lines in the middle, the action at the thumb. Calm light palette, flat geometric art. */
:root{
  --bg:#ECEEF1; --card:#F8F9FA; --ink:#2F3540; --dim:#6B7380; --line:#D6DBE1;
  --blue:#6F8FAF; --sage:#7FA38C; --ochre:#CF9E4A; --coral:#D2786B; --lilac:#9C91BE; --ok:#4F9476; --bad:#C25E57;
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.top{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:8px;padding-block:10px 6px}
.top .t{font:600 12px var(--m);letter-spacing:.1em;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{height:34px;min-width:34px;border:1px solid var(--line);border-radius:10px;background:var(--card);font:600 11px var(--m);letter-spacing:.06em;color:var(--dim);padding:0 9px}
.ib.on{color:var(--blue);border-color:var(--blue)}
.tools{display:flex;gap:6px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .4s}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.still{position:relative;margin-top:10px;border-radius:16px;overflow:hidden;aspect-ratio:16/10;max-height:33vh;flex:0 0 auto;background:#DCE4EC}
.still>svg{display:block;width:100%;height:100%}
.still .place{position:absolute;left:10px;top:10px;background:rgba(248,249,250,.86);border-radius:8px;padding:3px 8px;font:600 11px var(--m);letter-spacing:.08em}
.still.hunt [data-o]{cursor:pointer}
.still{transition:max-height .3s}.still.mini{max-height:12vh}.still.mini .place{display:none}
.still [data-o]{transform-box:fill-box;transform-origin:center}
.still [data-o].hit{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.04)}}
.lines{flex:1;min-height:0;overflow:auto;padding-block:12px 6px;display:flex;flex-direction:column;gap:10px}
.ln{animation:in .3s ease-out;max-width:92%}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.ln .who{font:600 11px var(--m);letter-spacing:.1em;margin-bottom:2px}
.ln .da{font-size:20px;line-height:1.35;font-weight:500}
.ln.narr .da{font-style:italic;font-weight:400;color:#4A515D}
.ln .en{font-size:14px;color:var(--dim);margin-top:2px}
.ln.solved .da{color:var(--ok)}
.ln.me{align-self:flex-end;text-align:right}
.c-blue{color:var(--blue)} .c-coral{color:var(--coral)} .c-sage{color:var(--sage)} .c-lilac{color:var(--lilac)} .c-ochre{color:var(--ochre)}
.act{flex:0 0 auto;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.next{height:48px;border-radius:12px;background:var(--card);border:1px solid var(--line);font:600 13px var(--m);letter-spacing:.1em;color:var(--dim)}
.q{font-weight:600;font-size:15px;color:var(--ink)}
.gl{font-size:20px;font-weight:500}.gap{display:inline-block;min-width:2.6em;border-bottom:2px solid var(--blue);color:var(--blue);text-align:center}
.opts{display:grid;gap:8px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font-size:18px;font-weight:500}
.opt[disabled]{opacity:.4;text-decoration:line-through}.opt.right{border-color:var(--ok);color:var(--ok)}
.why{background:#F6E9E6;border-radius:12px;padding:9px 12px;font-size:14px;line-height:1.45}.why b{color:var(--bad)}
.shake{animation:sh .35s}@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.replay{justify-self:start;border:1px solid var(--blue);color:var(--blue);border-radius:20px;padding:6px 14px;font:600 12px var(--m)}
.pieces,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.built{border:1.5px dashed var(--line);border-radius:12px;padding:8px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:18px;font-weight:500;box-shadow:0 1px 0 var(--line)}
.pc.used{visibility:hidden}.built .pc{border-color:var(--blue)}
/* sort */
.card{justify-self:center;min-width:60%;text-align:center;background:var(--card);border-radius:16px;padding:18px 20px;font-size:24px;font-weight:600;box-shadow:0 6px 18px rgba(47,53,64,.10);touch-action:none;user-select:none;-webkit-user-select:none}
.card small{display:block;font:500 12px var(--m);color:var(--dim);margin-top:4px}
.bins{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.bin{border-radius:14px;padding:14px 6px;font:600 16px var(--f);color:#fff;min-height:64px;display:grid;place-items:center;transition:transform .15s}
.bin small{font:500 12px var(--m);opacity:.85}
.bin.flash{transform:scale(1.06)}
.b0{background:var(--blue)}.b1{background:var(--sage)}.b2{background:var(--ochre)}.b3{background:var(--lilac)}
.drag{position:fixed;z-index:30;pointer-events:none;opacity:.92;transform:translate(-50%,-50%) rotate(-2deg)}
/* map */
.map{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border-radius:16px;padding:8px}
.lot{min-height:58px;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;font-size:13px;font-weight:600;padding:4px}
.lot.fix{border-style:solid;background:#E4E9EE;color:var(--dim)}
.lot.drop{border-color:var(--blue);background:#E7EEF6}
.lot svg,.chip svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.street{grid-column:1/-1;height:26px;border-radius:6px;background:#D9DEE4;display:grid;place-items:center;font:600 11px var(--m);letter-spacing:.12em;color:var(--dim)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--card);border:1.5px solid var(--blue);border-radius:12px;padding:6px 12px;font-size:14px;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none;text-align:center}
.chip.sel{background:var(--blue);color:#fff}
.clues{display:grid;gap:4px;font-size:16px;font-weight:500}
.clues button{text-align:left}
/* timeline */
.tl{position:relative;height:96px;background:var(--card);border-radius:16px;margin-top:4px}
.tl .axis{position:absolute;left:6%;right:6%;top:58px;height:3px;background:var(--line);border-radius:2px}
.tl .tk{position:absolute;top:44px;width:30px;height:30px;margin-left:-15px;border-radius:50%;display:grid;place-items:center}
.tl .tk i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.tl .tk.drop i{background:var(--blue)}.tl .tk.now i{background:var(--ink)}
.tl .lb{position:absolute;top:76px;transform:translateX(-50%);font:500 11px var(--m);color:var(--dim);white-space:nowrap}
.tl .pin{position:absolute;top:6px;transform:translateX(-50%);background:var(--blue);color:#fff;border-radius:8px;padding:3px 7px;font-size:12px;font-weight:600;white-space:nowrap}
/* clock */
.clock{position:relative;width:220px;height:220px;justify-self:center;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 2px var(--line)}
.clock button{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;font-weight:600;font-size:16px}
.clock button:active,.clock button.right{background:var(--blue);color:#fff}
.clock .mid{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;font:600 14px var(--m);color:var(--dim)}
/* home */
.home{flex:1;min-height:0;overflow:auto;padding-block:12px;display:grid;gap:12px;align-content:start}
.home h1{font-size:34px;line-height:1.05;margin:4px 0 0;font-weight:700;letter-spacing:-.01em}
.home p{margin:0;color:var(--dim)}
.tabs{display:flex;gap:6px;background:#E1E5EA;border-radius:12px;padding:4px}
.tab{flex:1;height:36px;border-radius:9px;font:600 12px var(--m);letter-spacing:.08em;color:var(--dim)}.tab.on{background:var(--card);color:var(--ink)}
.sc{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:14px;padding:10px 12px}
.sc .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700}
.sc b{display:block;font-size:18px}.sc small{color:var(--dim);font-size:13px}
.stars{font-size:14px;letter-spacing:1px;color:var(--ochre)}.stars .off{color:var(--line)}
.best{font:600 12px var(--m);color:var(--dim)}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:600 14px var(--m);letter-spacing:.05em;padding:0 16px}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
.end{display:grid;gap:8px;background:var(--card);border-radius:16px;padding:14px}
.end h2{margin:0;font-size:28px}
.k{font:500 13px/1.6 var(--m);color:var(--dim)}
/* arcade */
.hud{display:flex;justify-content:space-between;align-items:center;font:600 14px var(--m);padding-block:12px 4px}
.hud .combo{color:var(--ochre)}
.timer{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.timer i{display:block;height:100%;background:var(--sage)}
.arena{flex:1;min-height:0;display:grid;align-content:center;gap:18px}
.fb{min-height:44px;text-align:center;font-size:15px}
.fb .ok{color:var(--ok);font-weight:600}.fb .no{color:var(--bad)}
.sheet{position:fixed;inset:0;background:rgba(47,53,64,.35);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet>div{width:100%;max-width:480px;background:var(--card);border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:grid;gap:10px;max-height:80%;overflow:auto}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px}.vrow.on{border-color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

   en:'But sometimes I miss my family.',rule:'R9',why:'In a main clause the adverb comes after the verb: jeg savner nogle gange. If it stands first, the verb still comes second: nogle gange savner jeg.'},

  {s:'narr',da:'Du kigger på billetterne.',en:'You look at the tickets.'},

    if(ghost){ghost.style.left=ev.clientX+'px';ghost.style.top=ev.clientY+'px';document.querySelectorAll('[data-drop]').forEach(d=>d.classList.remove('drop'));const t=dropAt(ev);if(t)t.classList.add('drop')}};
  const up=ev=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.querySelectorAll('[data-drop]').forEach(d=>d.classList.remove('drop'));
    if(ghost){ghost.remove();const t=dropAt(ev);if(t)onDrop(t)}else el.dispatchEvent(new CustomEvent('tapsel'))};

  if(g.type==='bins'){ar.innerHTML=`<div class="card" id="cd">${esc(it.w)}</div>`;
    A.innerHTML=`<div class="bins" style="--n:${g.vertical?1:g.bins.length}">${g.bins.map((x,j)=>`<button class="bin b${j%4}" type="button" data-drop="${j}" data-j="${j}">${esc(x)}</button>`).join('')}</div>`;
    A.querySelectorAll('.bin').forEach(x=>x.onclick=()=>answer(+x.dataset.j));draggable($('#cd'),t=>answer(+t.dataset.j));if(it.say)speak(it.w)}
  else{const ticks=[-24,-18,-12,-6,6,12,18,24],x=v=>6+88*(v+24)/48;ar.innerHTML=`<div class="card">${esc(it.w)}</div>`;
    A.innerHTML=`<div class="tl"><div class="axis"></div>${ticks.map(t=>`<button type="button" class="tk" style="left:${x(t)}%" data-t="${t}"><i></i></button>`).join('')}<div class="tk now" style="left:${x(0)}%"><i></i></div>
      ${[-24,-12,0,12,24].map(t=>`<div class="lb" style="left:${x(t)}%">${t===0?'NU':(t<0?'−':'+')+Math.abs(t/12)+' år'}</div>`).join('')}</div>`;
    A.querySelectorAll('.tk[data-t]').forEach(b=>b.onclick=()=>answer(+b.dataset.t));speak(it.w)}}
function answer(a){if(!AR||AR.lock||AR.over)return;AR.lock=true;const it=AR.cur,fb=$('#fb');
  if(a===it.a){AR.streak++;const mult=AR.streak>=10?3:AR.streak>=5?2:1;AR.score+=mult;SFX.ok();if(mult>1)SFX.combo(AR.streak);
    $('#sc').textContent=AR.score;$('#cb').textContent=mult>1?`COMBO ×${mult}`:'';fb.innerHTML=`<span class="ok">${esc(it.show)}</span>`;if(!it.say)speak(it.show.split(' · ')[0].replace('→',''));setTimeout(nextItem,380)}
  else{AR.streak=0;$('#cb').textContent='';SFX.no();AR.miss.push(it);const g=AR.g;fb.innerHTML=`<span class="no">${esc(it.show)}</span>`;
    const cd=$('#ar .card');if(cd){cd.classList.remove('shake');void cd.offsetWidth;cd.classList.add('shake')}setTimeout(nextItem,1300)}}
function arcadeEnd(){AR.over=true;SFX.end();const g=AR.g;const prev=st.best[g.id];const nb=prev==null||AR.score>prev;if(nb)st.best[g.id]=AR.score;save();
  const ms=[...new Map(AR.miss.map(m=>[m.show,m])).values()];
  $('#ar').innerHTML=`<div class="end"><h2>${AR.score} points</h2><div class="k">${nb?'New personal best.':'Best: '+prev}</div>
    ${ms.length?`<div class="k">Learn these:<br>${ms.map(m=>esc(m.show)).join('<br>')}</div>`:'<div class="k">No misses.</div>'}<div class="k">${g.rule} · ${esc(R[g.rule])}</div></div>`;
  $('#fb').innerHTML='';$('#act').innerHTML=`<button class="btn main" type="button" id="ag">PLAY AGAIN</button><button class="btn" type="button" id="hm">HOME</button>`;
  $('#ag').onclick=()=>arcade(g);$('#hm').onclick=home}

/* ---------- settings ---------- */
$('#b-home').onclick=()=>{if(AR)AR.over=true;home()};
$('#b-en').onclick=()=>{st.en=!st.en;store.set('en',st.en);document.querySelectorAll('.ln .en').forEach(e=>e.hidden=!st.en);$('#b-en').classList.toggle('on',st.en)};$('#b-en').classList.toggle('on',st.en);
function voiceSheet(){loadV();const cur=(VO.find(v=>v.name===store.get('voice',null))||VO[0]||{}).name;
  $('#sheet-in').innerHTML=`<b>Voice</b>${VO.length?VO.map(v=>`<div class="vrow ${v.name===cur?'on':''}"><span>${esc(v.name)}</span><button class="btn" type="button" data-v="${esc(v.name)}">${v.name===cur?'IN USE':'USE'}</button></div>`).join(''):'<span>No Danish voice on this device, so the lines are shown without sound.</span>'}
    <span class="k">iPhone: Settings › Accessibility › Spoken Content › Voices › Danish, then download an Enhanced voice. Android: Settings › Text-to-speech › Danish. Reload afterwards.</span><button class="btn" type="button" id="vx">CLOSE</button>`;
  $('#sheet').hidden=false;document.querySelectorAll('[data-v]').forEach(x=>x.onclick=()=>{store.set('voice',x.dataset.v);speak('Hej! Er du ny her?',SP.man);voiceSheet()});$('#vx').onclick=()=>$('#sheet').hidden=true}
$('#b-voice').onclick=voiceSheet;
home();
window.SCENES=SCENES;window.ST=st;window.GAMES=GAMES;window.ARC=()=>AR;
</script>
